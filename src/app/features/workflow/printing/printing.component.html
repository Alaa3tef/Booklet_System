<app-workflow-step-layout
  stepNumber="02"
  englishLabel="Printing"
  arabicTitle="مستخدم الطباعة"
  arabicSubtitle="اختيار المحافظة والمادة وتحويلها إلى تم الانتهاء من الطباعة"
  theme="green"
  activeNavKey="printing"
  illustrationIcon="pi pi-print"
  illustrationTaglineTop="طباعة دقيقة"
  illustrationTaglineBottom="لمستقبل أفضل"
  panelIcon="pi pi-print"
  panelTitle="الطباعة"
  functionLabel="مستخدم الطباعة"
  [essentials]="essentials"
  resultText="يتم تحديث حالة المادة إلى تم الانتهاء من الطباعة"
>

  <div panel-content>

    <!-- ==========================================
         SEARCH SECTION
    =========================================== -->

    <div class="search-section">

      <div class="printing-search-card">

        <!-- IMAGE -->

        <div class="printing-image">

          <img
            src="assets/images/printing.png"
            alt="الطباعة"
          />

        </div>

        <!-- SEARCH CONTENT -->

        <div class="printing-search-content">

          <div class="printing-search-title">

            <div class="printing-search-icon">
              <i class="pi pi-print"></i>
            </div>

            <div>

              <h3>
                البحث في قائمة الطباعة
              </h3>

              <p>
                اختر المحافظة والمادة لعرض المواد المطلوب طباعتها
              </p>

            </div>

          </div>


          <div class="fields-grid">

            <!-- GOVERNORATE -->

            <div class="field">

              <label for="printing-governorate">
                المحافظة
              </label>

              <p-select
                inputId="printing-governorate"
                [options]="governorates"
                [(ngModel)]="selectedGovernorate"
                optionLabel="label"
                optionValue="value"
                styleClass="w-full">
              </p-select>

            </div>


            <!-- SUBJECT -->

            <div class="field">

              <label for="printing-subject">
                المادة
              </label>

              <p-select
                inputId="printing-subject"
                [options]="subjects"
                [(ngModel)]="selectedSubject"
                optionLabel="label"
                optionValue="value"
                styleClass="w-full">
              </p-select>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- ==========================================
         TABLE SECTION
    =========================================== -->

    <div class="table-section">

      <div class="table-header">

        <h4>
          قائمة الطباعة
        </h4>

        <span class="results-count">
          {{ rows().length }} مادة
        </span>

      </div>


      <p-table
        [value]="rows()"
        styleClass="p-datatable-sm"
        responsiveLayout="scroll"
      >

        <!-- TABLE HEADER -->

        <ng-template pTemplate="header">

          <tr>

            <th>م</th>

            <th>المحافظة</th>

            <th>المادة</th>

            <th>الحالة</th>

            <th>الإجراء</th>

          </tr>

        </ng-template>


        <!-- TABLE BODY -->

        <ng-template
          pTemplate="body"
          let-row
        >

          <tr>

            <!-- INDEX -->

            <td>
              {{ row.index }}
            </td>


            <!-- GOVERNORATE -->

            <td>
              {{ row.governorate }}
            </td>


            <!-- SUBJECT -->

            <td>
              {{ row.subject }}
            </td>


            <!-- STATUS -->

            <td>

              <span
                class="status-pill"
                [ngClass]="row.statusTone"
              >
                {{ row.status }}
              </span>

            </td>


            <!-- ACTION -->

            <td class="status-cell">

              <button
                type="button"
                class="status-menu-btn"
                aria-label="إجراءات الحالة"
                title="إجراءات الحالة"
                (click)="openStatusMenu(row, statusMenu, $event)"
              >

                <i class="pi pi-ellipsis-v"></i>

              </button>

            </td>

          </tr>

        </ng-template>


        <!-- EMPTY MESSAGE -->

        <ng-template pTemplate="emptymessage">

          <tr>

            <td
              colspan="5"
              class="empty-message"
            >

              <i class="pi pi-search"></i>

              لا توجد نتائج مطابقة للبحث

            </td>

          </tr>

        </ng-template>

      </p-table>


      <!-- ONE POPUP MENU -->

      <p-menu
        #statusMenu
        [model]="menuItems"
        [popup]="true"
        appendTo="body"
      >
      </p-menu>

    </div>

  </div>

</app-workflow-step-layout>

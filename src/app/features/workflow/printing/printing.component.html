<app-workflow-step-layout
  stepNumber="02"
  englishLabel="Printing"
  arabicTitle="مستخدم الطباعة"
  arabicSubtitle="اختيار المحافظة والمادة وتحويلها إلى تم الانتهاء من الطباعة"
  theme="green"
  activeNavKey="printing"
  illustrationIcon="pi pi-print"
  illustrationTaglineTop="طباعة دقيقة"
  illustrationTaglineBottom="لمستقبل أفضل"
  panelIcon="pi pi-print"
  panelTitle="الطباعة"
  functionLabel="مستخدم الطباعة"
  [essentials]="essentials"
  resultText="يتم تحديث حالة المادة إلى تم الانتهاء من الطباعة"
>
  <div panel-content>
    <div class="fields-grid">
      <div class="field">
        <label>المحافظة</label>
        <p-select [options]="governorates" [(ngModel)]="selectedGovernorate" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
      <div class="field">
        <label>المادة</label>
        <p-select [options]="subjects" [(ngModel)]="selectedSubject" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
    </div>

    <button type="button" class="opt-btn solid-green main-action" (click)="finishPrinting()">
      <i class="pi pi-check"></i> تم الانتهاء من الطباعة
    </button>

    <div class="table-section">
      <h4>قائمة الطباعة</h4>
      <p-table [value]="rows()" styleClass="p-datatable-sm" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>الحالة</th>
            <th>المادة</th>
            <th>المحافظة</th>
            <th>م</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td><span class="status-pill" [ngClass]="row.statusTone">{{ row.status }}</span></td>
            <td>{{ row.subject }}</td>
            <td>{{ row.governorate }}</td>
            <td>{{ row.index }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-container system-options>
    <button type="button" class="opt-btn solid-green" (click)="finishPrinting()">
      <i class="pi pi-check"></i> تم الانتهاء من الطباعة
    </button>
    <button type="button" class="opt-btn outline">عرض التفاصيل</button>
  </ng-container>
</app-workflow-step-layout>

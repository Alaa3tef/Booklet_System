<app-workflow-step-layout
  stepNumber="02"
  englishLabel="Printing"
  arabicTitle="مستخدم الطباعة"
  arabicSubtitle="اختيار المحافظة والمادة وتحويلها إلى تم الانتهاء من الطباعة"
  theme="green"
  activeNavKey="printing"
  illustrationIcon="pi pi-print"
  illustrationTaglineTop="طباعة دقيقة"
  illustrationTaglineBottom="لمستقبل أفضل"
  panelIcon="pi pi-print"
  panelTitle="الطباعة"
  functionLabel="مستخدم الطباعة"
  [essentials]="essentials"
  resultText="يتم تحديث حالة المادة إلى تم الانتهاء من الطباعة"
>
  <div panel-content>

    <!-- Search -->
    <div class="fields-grid">

      <div class="field">
        <label>المحافظة</label>

        <p-select
          [options]="governorates"
          [(ngModel)]="selectedGovernorate"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full">
        </p-select>
      </div>

      <div class="field">
        <label>المادة</label>

        <p-select
          [options]="subjects"
          [(ngModel)]="selectedSubject"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full">
        </p-select>
      </div>

    </div>

    <!-- Printing Table -->
    <div class="table-section">

      <h4>قائمة الطباعة</h4>

      <p-table
        [value]="rows()"
        styleClass="p-datatable-sm"
        responsiveLayout="scroll">

        <ng-template pTemplate="header">
          <tr>
            <th>م</th>
            <th>المحافظة</th>
            <th>المادة</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr>
 
            <!-- Index -->
            <td>
              {{ row.index }}
            </td>

             <!-- Governorate -->
            <td>
              {{ row.governorate }}
            </td>

            <!-- Subject -->
            <td>
              {{ row.subject }}
            </td>

             <td><span class="status-pill" [ngClass]="row.statusTone">{{ row.status }}</span></td>

             <!-- Status -->
            <td class="status-cell">

              <button
                type="button"
                class="status-menu-btn"
                aria-label="إجراءات الحالة"
                (click)="openStatusMenu(row, statusMenu, $event)"
              >
                <i class="pi pi-ellipsis-v"></i>
              </button>

            </td>

          </tr>
        </ng-template>

      </p-table>

      <!-- One popup menu for all rows -->
      <p-menu
        #statusMenu
        [model]="menuItems"
        [popup]="true"
        appendTo="body">
      </p-menu>

    </div>

  </div>
</app-workflow-step-layout>

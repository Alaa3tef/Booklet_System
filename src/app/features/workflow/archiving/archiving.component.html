<app-workflow-step-layout
  stepNumber="05"
  englishLabel="Archiving"
  arabicTitle="مستخدم التخزين"
  arabicSubtitle="تخزين المادة وتحديد مكان التخزين في المخزن"
  theme="teal"
  activeNavKey="archiving"
  illustrationIcon="pi pi-database"
  illustrationTaglineTop="حفظ أمن"
  illustrationTaglineBottom="لمستقبل التعليم"
  panelIcon="pi pi-database"
  panelTitle="التخزين"
  functionLabel="مستخدم التخزين"
  [essentials]="essentials"
  resultText="يتم تخزين اللجنة بنجاح وتسجيل موقع التخزين"
>
  <div panel-content>
    <div class="fields-grid cols-3 location-picker">
      <div class="field">
        <label>المنطقة</label>
        <p-select [options]="zones" [(ngModel)]="selectedZone" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
      <div class="field">
        <label>الرف</label>
        <p-select [options]="shelves" [(ngModel)]="selectedShelf" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
      <div class="field">
        <label>الخانة</label>
        <p-select [options]="slots" [(ngModel)]="selectedSlot" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
    </div>

    <div class="qr-scan-block main-action">
      <div class="qr-icon"><i class="pi pi-qrcode"></i></div>
      <p class="qr-label">امسح QR اللجنة الخارجية</p>
    </div>

    <button type="button" class="opt-btn solid-teal main-action" (click)="confirmStorage()">
      <i class="pi pi-check"></i> تأكيد التخزين
    </button>

    <div class="table-section">
      <h4>سجل التخزين</h4>
      <p-table [value]="rows()" styleClass="p-datatable-sm" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>الحالة</th>
            <th>مكان التخزين</th>
            <th>المادة</th>
            <th>رقم اللجنة</th>
            <th>م</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td><span class="status-pill" [ngClass]="row.statusTone">{{ row.status }}</span></td>
            <td>{{ row.location }}</td>
            <td>{{ row.subject }}</td>
            <td>{{ row.committeeNumber }}</td>
            <td>{{ row.index }}</td>
          </tr>       
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-container system-options>
    <button type="button" class="opt-btn solid-teal" (click)="confirmStorage()">
      <i class="pi pi-check"></i> تأكيد التخزين
    </button>
  </ng-container>
</app-workflow-step-layout>

<app-workflow-step-layout
  stepNumber="03"
  englishLabel="Quality"
  arabicTitle="مستخدم الجودة"
  arabicSubtitle="تغليف البوكليت في أظرف صغيرة لكل لجنة ومراجعتها"
  theme="navy"
  activeNavKey="quality"
  illustrationIcon="pi pi-verified"
  illustrationTaglineTop="الجودة اليوم"
  illustrationTaglineBottom="تعليم أفضل غدًا"
  panelIcon="pi pi-verified"
  panelTitle="مراجعة لجان الجودة"
  functionLabel="مستخدم الجودة"
  [essentials]="essentials"
  resultText="يتم تسجيل حالة المراجعة لكل لجنة"
>
  <div panel-content>
    <div class="qr-scan-block main-action">
      <div class="qr-icon"><i class="pi pi-qrcode"></i></div>
      <p class="qr-label">امسح QR اللجنة الخارجية</p>
    </div>

    <div class="dual-actions">
      <button type="button" class="opt-btn solid-green" (click)="approve()">
        <i class="pi pi-check"></i> تم المراجعة
      </button>
      <button type="button" class="opt-btn solid-red" (click)="reject()">
        <i class="pi pi-times"></i> مرفوض
      </button>
    </div>

    <div class="table-section">
      <h4>سجل المراجعة</h4>
      <p-table [value]="rows()" styleClass="p-datatable-sm" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>الحالة</th>
            <th>المادة</th>
            <th>رقم اللجنة</th>
            <th>م</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td><span class="status-pill" [ngClass]="row.statusTone">{{ row.status }}</span></td>
            <td>{{ row.subject }}</td>
            <td>{{ row.committeeNumber }}</td>
            <td>{{ row.index }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-container system-options>
    <button type="button" class="opt-btn solid-green" (click)="approve()">
      <i class="pi pi-check"></i> تم المراجعة
    </button>
    <button type="button" class="opt-btn solid-red" (click)="reject()">
      <i class="pi pi-times"></i> مرفوض
    </button>
  </ng-container>
</app-workflow-step-layout>

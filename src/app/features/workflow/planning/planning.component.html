<app-workflow-step-layout
  stepNumber="01"
  englishLabel="Planning"
  arabicTitle="مستخدم الإعداد"
  arabicSubtitle="البحث عن المواد وتغيير حالتها"
  theme="blue"
  activeNavKey="planning"
  illustrationIcon="pi pi-desktop"
  illustrationTaglineTop="التخطيط اليوم"
  illustrationTaglineBottom="لصناعة تعليم أفضل"
  panelIcon="pi pi-sliders-h"
  panelTitle="البحث في خطط الإنتاج"
  functionLabel="مستخدم الإعداد"
  [essentials]="essentials"
  resultText="يمكن تغيير حالة كل مادة مباشرة من الجدول"
>

  <div panel-content>

    <!-- ==========================================
         SEARCH SECTION
    =========================================== -->

    <div class="search-section">

      <div class="planning-search-card">

        <!-- IMAGE -->

        <div class="planning-image">
          <img
            src="assets/images/planning.png"
            alt="التخطيط"
          />
        </div>

        <!-- SEARCH CONTENT -->

        <div class="planning-search-content">

          <div class="planning-search-title">

            <div class="planning-search-icon">
              <i class="pi pi-search"></i>
            </div>

            <div>
              <h3>البحث في خطط الإنتاج</h3>

              <p>
                اختر المحافظة والمادة لعرض الخطة المطلوبة
              </p>
            </div>

          </div>

          <div class="fields-grid">

            <!-- GOVERNORATE -->

            <div class="field">

              <label for="governorate">
                المحافظة
              </label>

              <p-select
                inputId="governorate"
                [options]="governorates"
                [(ngModel)]="selectedGovernorate"
                optionLabel="label"
                optionValue="value"
                styleClass="w-full">
              </p-select>

            </div>

            <!-- SUBJECT -->

            <div class="field">

              <label for="subject">
                المادة
              </label>

              <p-select
                inputId="subject"
                [options]="subjects"
                [(ngModel)]="selectedSubject"
                optionLabel="label"
                optionValue="value"
                styleClass="w-full">
              </p-select>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- ==========================================
         TABLE SECTION
    =========================================== -->

    <div class="table-section">

      <div class="table-header">

        <h4>
          الخطط المسجلة
        </h4>

        <span class="results-count">
          {{ filteredRows().length }} مادة
        </span>

      </div>


      <p-table
        [value]="filteredRows()"
        styleClass="p-datatable-sm"
        responsiveLayout="scroll">

        <!-- TABLE HEADER -->

        <ng-template pTemplate="header">

          <tr>

            <th>
              م
            </th>

            <th>
              المحافظة
            </th>

            <th>
              المادة
            </th>

            <th>
              الحالة
            </th>

            <th class="action-header">
              إجراء
            </th>

          </tr>

        </ng-template>


        <!-- TABLE BODY -->

        <ng-template
          pTemplate="body"
          let-row>

          <tr>

            <!-- INDEX -->

            <td>
              {{ row.index }}
            </td>


            <!-- GOVERNORATE -->

            <td>
              {{ row.governorate }}
            </td>


            <!-- SUBJECT -->

            <td>
              {{ row.subject }}
            </td>


            <!-- STATUS -->

            <td>
              <span
                class="status-pill"
                [ngClass]="row.statusTone">
                {{ row.status }}
              </span>
            </td>


            <!-- ACTION -->

            <td class="status-cell">

              <button
                type="button"
                class="status-menu-btn"
                aria-label="إجراءات الحالة"
                pTooltip="إجراءات الحالة"
                tooltipPosition="top"
                (click)="openStatusMenu(row, statusMenu, $event)"
              >
                <i class="pi pi-ellipsis-v"></i>
              </button>

            </td>

          </tr>

        </ng-template>


        <!-- EMPTY MESSAGE -->

        <ng-template pTemplate="emptymessage">

          <tr>

            <td
              colspan="5"
              class="empty-message">

              <i class="pi pi-search"></i>

              لا توجد نتائج مطابقة للبحث

            </td>

          </tr>

        </ng-template>

      </p-table>


      <!-- SINGLE POPUP MENU -->

      <p-menu
        #statusMenu
        [model]="menuItems"
        [popup]="true"
        appendTo="body">
      </p-menu>

    </div>

  </div>

</app-workflow-step-layout>

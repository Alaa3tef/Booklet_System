<app-workflow-step-layout
  stepNumber="01"
  englishLabel="Planning"
  arabicTitle="مستخدم الإعداد"
  arabicSubtitle="اختيار المحافظة والمادة وتحويلها إلى جاهز للطباعة"
  theme="blue"
  activeNavKey="planning"
  illustrationIcon="pi pi-desktop"
  illustrationTaglineTop="التخطيط اليوم"
  illustrationTaglineBottom="لصناعة تعليم أفضل"
  panelIcon="pi pi-sliders-h"
  panelTitle="إعداد الإنتاج"
  functionLabel="مستخدم الإعداد"
  [essentials]="essentials"
  resultText="يتم تحويل المادة إلى جاهز للطباعة"
>
  <div panel-content>
    <div class="fields-grid">
      <div class="field">
        <label>المحافظة</label>
        <p-select [options]="governorates" [(ngModel)]="selectedGovernorate" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
      <div class="field">
        <label>المادة</label>
        <p-select [options]="subjects" [(ngModel)]="selectedSubject" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
    </div>

    <button type="button" class="opt-btn solid-blue main-action" (click)="markReadyForPrinting()">
      <i class="pi pi-refresh"></i> تحويل إلى جاهز للطباعة
    </button>

    <div class="table-section">
      <h4>الخطط المسجلة</h4>
      <p-table [value]="rows()" styleClass="p-datatable-sm" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>الحالة</th>
            <th>المادة</th>
            <th>المحافظة</th>
            <th>م</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td><span class="status-pill" [ngClass]="row.statusTone">{{ row.status }}</span></td>
            <td>{{ row.subject }}</td>
            <td>{{ row.governorate }}</td>
            <td>{{ row.index }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-container system-options>
    <button type="button" class="opt-btn solid-blue" (click)="markReadyForPrinting()">
      <i class="pi pi-refresh"></i> تحويل إلى جاهز للطباعة
    </button>
    <button type="button" class="opt-btn outline">عرض التفاصيل</button>
  </ng-container>
</app-workflow-step-layout>

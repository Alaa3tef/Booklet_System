<p-dialog
  [visible]="sessionExpired.visible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
  [baseZIndex]="30000"
  [style]="{ width: '420px', maxWidth: '92vw' }">

  <ng-template #header>
    <div dir="rtl" style="display:flex;align-items:center;gap:8px;font-weight:700">
      <i class="pi pi-lock" style="color:#d97706"></i>
      انتهت الجلسة
    </div>
  </ng-template>

  <p dir="rtl" style="margin:0;line-height:1.8">
    تم تغيير كلمة المرور الخاصة بك. يرجى تسجيل الدخول مرة أخرى للمتابعة.
  </p>

  <ng-template #footer>
    <p-button
      label="تسجيل الدخول"
      icon="pi pi-sign-in"
      (onClick)="goToLogin()" />
  </ng-template>
</p-dialog>
